name: LolPing
options:
  bundleIdPrefix: com.cloudza
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  LPCore:
    path: Packages/LPCore
  LPRooms:
    path: Packages/LPRooms
  # In-app updates: download, signature check, swapping the app and relaunching.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: KTP97H9YFF
    CODE_SIGN_STYLE: Automatic
targets:
  LolPing:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Resources/textures"
          - "Resources/sounds"
          - "Resources/emotes"
      - path: App/Resources/textures
        type: folder
      - path: App/Resources/sounds
        type: folder
      - path: App/Resources/emotes
        type: folder
    dependencies:
      - package: LPCore
      - package: LPRooms
        product: LPRooms
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloudza.LolPing
        PRODUCT_NAME: LolPing
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        # Where updates come from and the key that signs them. The release pipeline fills these in; left empty, as
        # in every build made by hand, the app doesn't look for updates at all.
        LP_UPDATE_FEED_URL: ""
        LP_UPDATE_PUBLIC_KEY: ""
      configs:
        # The development build is its own app: its own name, bundle id, settings folder and Accessibility entry,
        # so running from Xcode never disturbs the permissions or settings of the released app.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.cloudza.LolPing.dev
          PRODUCT_NAME: LolPing-Dev
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Code under the MIT licence. Ping and emote art and sounds © Riot Games."
        NSLocalNetworkUsageDescription: "LolPing finds the other people in your room on the local network and sends them your pings."
        # owner/repo on GitHub: the project page linked from Settings. Empty: no link.
        LPUpdateRepo: icloudza/lol-ping
        # In-app updates (Sparkle). The address and the key arrive as build settings from the release pipeline.
        SUFeedURL: $(LP_UPDATE_FEED_URL)
        SUPublicEDKey: $(LP_UPDATE_PUBLIC_KEY)
        # Checks from the first launch on (no "may I check for updates?" prompt on the second one), at launch and
        # then hourly, which is the shortest interval Sparkle allows. The switch is in Settings.
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 3600
        # The EdDSA signature is checked before the download is unpacked, and the appcast itself must be signed.
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
