# 发布 LolPing：推送 vX.Y.Z 标签即触发（预发布用 vX.Y.Z-beta.N / vX.Y.Z-rc.N）。
# 流程：测试 → Developer ID 签名 → 公证 → DMG → 更新签名与 appcast → GitHub Release。
# 应用内的在线更新（Sparkle）读的是最新正式版 Release 上的 appcast.xml，发布完成后已安装的用户即可在应用里下载安装。
# 需要的 Secrets / Variables 见 Scripts/release/README.md。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要（重新）发布的已有标签，例如 v1.1.0
        required: true

permissions:
  contents: write

# 同一时间只跑一个发布，后来的排队，不取消正在公证或上传的那个。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      # checkout 会把附注标签改写成轻量标签，重新取回才能读到标签里的更新说明。
      - name: 取回标签
        run: git fetch --force --tags origin

      - name: 版本号
        run: |
          Scripts/release/version.sh "$TAG" | tee -a "$GITHUB_ENV"

      - name: 选择 Xcode
        run: |
          xcode="${{ vars.XCODE_PATH }}"
          if [ -z "$xcode" ]; then
            xcode=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: 安装 XcodeGen
        run: command -v xcodegen > /dev/null || brew install xcodegen

      # 手势引擎、偏好设置和房间协议的单元测试；不过就不发版。
      - name: 测试
        run: |
          swift test --package-path Packages/LPCore
          swift test --package-path Packages/LPRooms

      - name: 导入签名证书
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: Scripts/release/import-certificate.sh

      - name: 构建、签名、公证
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          UPDATE_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: Scripts/release/build.sh "$TAG"

      # 预发布不生成 appcast：latest/download 只指向正式版，预发布不该被推送给所有人。
      - name: 更新签名与 appcast
        if: env.PRERELEASE == 'false'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: Scripts/release/publish.sh "$TAG"

      - name: 更新说明
        run: Scripts/release/notes.sh "$TAG" --github > "$RUNNER_TEMP/notes.md" && cat "$RUNNER_TEMP/notes.md"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 安装包和 appcast 一起上传：gh 先建草稿、传完附件再公开，所以 latest/download/appcast.xml 不会指向缺文件的 Release。
          files=("build/release/LolPing-$VERSION.dmg")
          [ "$PRERELEASE" = false ] && files+=("build/release/appcast.xml")
          publish() {
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release upload "$TAG" "${files[@]}" --clobber
            else
              flags=()
              [ "$PRERELEASE" = true ] && flags+=(--prerelease)
              gh release create "$TAG" "${files[@]}" --verify-tag --title "LolPing $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
            fi
          }
          # GitHub 接口偶尔返回 500：间隔逐次加长重试，总共约 10 分钟。
          for wait in 30 60 120 180 240 0; do
            publish && exit 0
            [ "$wait" -eq 0 ] && break
            echo "创建 Release 失败，${wait} 秒后重试"
            sleep "$wait"
          done
          echo "::error::多次重试仍无法创建 GitHub Release；安装包已构建并公证，可稍后重跑本任务补上。"
          exit 1

      # 从公网取回 appcast 核对版本：这就是已安装的应用会读到的内容。
      - name: 核对 appcast
        if: env.PRERELEASE == 'false'
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "$url" | grep -q "<sparkle:version>$BUILD_NUMBER</sparkle:version>"; then
              echo "✓ $url 已是 $VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$url 还不是 $VERSION：检查这个 Release 是否是最新的正式版、附件里有没有 appcast.xml。"
          exit 1

      # Release 没建成时，安装包至少还能从运行页面取到。
      - name: 保留安装包
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LolPing-${{ env.VERSION }}
          path: build/release/*.dmg
          if-no-files-found: ignore
          retention-days: 7

      - name: 清理钥匙串与密钥
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"
